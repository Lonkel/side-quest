<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-24); gap: var(--space-16);">
      <div style="display: flex; align-items: center; gap: var(--space-8); flex: 1;">
        <h1 style="margin: 0;">💰 <span id="reportTitle">Ausgaben Tracker</span></h1>
        <button class="icon-btn" id="editTitleBtn" style="padding: 4px 8px; color: var(--color-primary);" title="Titel bearbeiten">✎</button>
      </div>
      <div style="display: flex; gap: var(--space-8);">
        <button class="btn-secondary" id="budgetBtn" style="white-space: nowrap;">Budget</button>
        <button class="btn-secondary" id="categoryBtn" style="white-space: nowrap;">Kategorien</button>
      </div>
    </div>

    <!-- Budget Modal -->
    <div id="budgetModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">Budget für <span id="budgetModalMonth">Januar 2026</span></div>
        <div class="form-group">
          <label for="budgetInput">Budget (€)</label>
          <input type="number" id="budgetInput" placeholder="0,00" step="0.01" min="0" />
        </div>
        <div class="modal-buttons">
          <button class="btn-primary" id="saveBudgetBtn">Speichern</button>
          <button class="btn-secondary" id="cancelBudgetBtn">Abbrechen</button>
        </div>
      </div>
    </div>

    <!-- Edit Title Modal -->
    <div id="editTitleModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">Berichtstitel bearbeiten</div>
        <div class="form-group">
          <label for="editTitleInput">Neuer Titel</label>
          <input type="text" id="editTitleInput" />
        </div>
        <div class="modal-buttons">
          <button class="btn-primary" id="saveTitleBtn">Speichern</button>
          <button class="btn-secondary" id="cancelTitleBtn">Abbrechen</button>
        </div>
      </div>
    </div>

    <div class="summary-section">
      <div class="summary-card">
        <div class="summary-label">Ausgaben Monat</div>
        <div class="summary-value" id="totalMonth">€0,00</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Ausgaben (ohne Fix & ETF)</div>
        <div class="summary-value" id="totalMonthWithoutFixedEtf">€0,00</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Restliches Budget</div>
        <div class="summary-value" id="remainingBudget">€0,00</div>
      </div>
    </div>

    <div class="form-section">
      <h2 style="margin: 0 0 var(--space-16) 0; font-size: 18px;">Neue Ausgabe hinzufügen</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="date">Datum</label>
          <input type="date" id="date" />
        </div>
        <div class="form-group">
          <label for="category">Kategorie</label>
          <select id="category">
            <option value="">-- Kategorie wählen --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="amount">Betrag (€)</label>
          <input type="number" id="amount" step="0.01" min="0" placeholder="0,00" />
        </div>
      </div>
      <div class="button-group">
        <button class="btn-primary" id="submitBtn">Hinzufügen</button>
        <button class="btn-secondary" id="resetBtn">Zurücksetzen</button>
      </div>
    </div>

    <!-- Tab Structure -->
    <div class="tabs-wrapper">
      <!-- Year Tabs (Ebene 1) -->
      <div class="year-tabs" id="yearTabs">
        <button class="year-tab active" data-year="2026">2026</button>
        <button class="year-tab" data-year="2025">2025</button>
        <button class="year-tab" data-year="2024">2024</button>
        <button class="year-tab" data-year="all">Gesamt</button>
      </div>

      <!-- Month Tabs (Ebene 2) -->
      <div class="month-tabs" id="monthTabs">
        <button class="month-tab" data-month="12">Dezember</button>
        <button class="month-tab" data-month="11">November</button>
        <button class="month-tab" data-month="10">Oktober</button>
        <button class="month-tab" data-month="09">September</button>
        <button class="month-tab" data-month="08">August</button>
        <button class="month-tab" data-month="07">Juli</button>
        <button class="month-tab" data-month="06">Juni</button>
        <button class="month-tab" data-month="05">Mai</button>
        <button class="month-tab" data-month="04">April</button>
        <button class="month-tab" data-month="03">März</button>
        <button class="month-tab" data-month="02">Februar</button>
        <button class="month-tab" data-month="01">Januar</button>
        <button class="month-tab" data-month="overview">Übersicht</button>
      </div>
    </div>

    <!-- Content Tabs (Ebene 3) -->
    <div class="content-tabs" id="contentTabs">
      <button class="content-tab active" data-content="expenses">Ausgaben</button>
      <button class="content-tab" data-content="statistics">Statistiken</button>
    </div>

    <!-- Ausgaben Section -->
    <div class="content-section active" id="expensesSection">
      <div class="table-section">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Datum</th>
              <th>Kategorie</th>
              <th class="text-right">Betrag</th>
              <th class="text-right">Aktion</th>
            </tr>
          </thead>
          <tbody id="expenseTable" draggable="false">
            <tr class="empty-state">
              <td colspan="5">Keine Ausgaben vorhanden. Füge deine erste Ausgabe hinzu!</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Statistiken Section -->
    <div class="content-section" id="statisticsSection">
      <div class="stats-section">
        <canvas id="categoryPieChart" style="max-width: 550px; max-height: 550px;"></canvas>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Ausgabe bearbeiten</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="editDate">Datum</label>
          <input type="date" id="editDate" />
        </div>
        <div class="form-group">
          <label for="editCategory">Kategorie</label>
          <select id="editCategory">
            <option value="">-- Kategorie wählen --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editAmount">Betrag (€)</label>
          <input type="number" id="editAmount" step="0.01" min="0" placeholder="0,00" />
        </div>
      </div>
      <div class="modal-buttons">
        <button class="btn-primary" id="saveBtn">Speichern</button>
        <button class="btn-secondary" id="cancelBtn">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js 3 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

  <!-- (Optional) Datalabels – falls du es noch irgendwo brauchst -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

  <!-- Outlabels-Plugin für Chart.js 3 (Leader-Lines + Labels außen) -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-outlabels3@1.3.7/dist/chartjs-plugin-outlabels3.min.js"></script>

  <script src="supabase.js"></script>
  <script src="report.js"></script>
</body>
</html>
