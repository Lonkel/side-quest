<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ausgabenberichte</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-24);
    }

    .landing-container {
      text-align: center;
      max-width: 400px;
    }

    .landing-container h1 {
      font-size: 42px;
      margin-bottom: var(--space-24);
    }

    .landing-container p {
      color: var(--color-text-secondary);
      margin-bottom: var(--space-24);
      font-size: 16px;
    }

    #newReportBtn {
      width: 100%;
      padding: 16px 24px;
      font-size: 16px;
      margin-bottom: var(--space-16);
    }

    .info-text {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: var(--space-16);
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <h1>💰 Ausgabenberichte</h1>
    <p>Verwalte deine Ausgaben einfach und übersichtlich. Erstelle einen neuen Bericht, um zu starten.</p>
    <button class="btn-primary" id="newReportBtn">Neuen Bericht anlegen</button>
    <div class="info-text">
      <p>💡 Tipp: Speichert euch den Link ab, um später auf eure Ausgaben zuzugreifen.</p>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    document.getElementById('newReportBtn').addEventListener('click', async () => {
      const btn = document.getElementById('newReportBtn');
      btn.disabled = true;
      btn.textContent = 'Wird erstellt...';

      try {
        const { data, error } = await db
          .from('reports')
          .insert({})
          .select('id')
          .single();

        if (error) {
          alert('Fehler beim Anlegen des Berichts: ' + error.message);
          btn.disabled = false;
          btn.textContent = 'Neuen Bericht anlegen';
          return;
        }

        const reportId = data.id;
        window.location.href = `/report.html?report_id=${reportId}`;
      } catch (error) {
        alert('Fehler: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Neuen Bericht anlegen';
      }
    });
  </script>
</body>
</html>
