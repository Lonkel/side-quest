<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget verwalten</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-24);">
      <h1 style="margin:0;">Budget verwalten</h1>
      <button class="btn-secondary" id="backBtn" type="button"
      onclick="window.location.href='report.html?report_id=' + new URLSearchParams(window.location.search).get('report_id')">Bericht</button>
    </div>

    <div class="form-section">
      <h2 style="margin: 0 0 var(--space-16) 0; font-size: 18px;">Monatsbudget hinzufügen / überschreiben</h2>

      <div class="form-grid">
        <div class="form-group">
          <label for="budgetYear">Jahr</label>
          <select id="budgetYear">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budgetMonth">Monat</label>
          <select id="budgetMonth">
            <option value="01">Januar</option>
            <option value="02">Februar</option>
            <option value="03">März</option>
            <option value="04">April</option>
            <option value="05">Mai</option>
            <option value="06">Juni</option>
            <option value="07">Juli</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Dezember</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budgetAmount">Budget (€)</label>
          <input id="budgetAmount" type="number" step="0.01" min="0" placeholder="0,00" inputmode="decimal" autocomplete="off" />
        </div>
      </div>

      <div class="button-group">
        <button class="btn-primary" id="addBudgetBtn" type="button">Hinzufügen</button>
        <button class="btn-secondary" id="resetBtn" type="button">Zurücksetzen</button>
      </div>
    </div>

    <div class="table-section">
      <h2 style="margin: 0 0 var(--space-16) 0; font-size: 18px;">Budgets</h2>
      <table>
        <thead>
          <tr>
            <th>Jahr</th>
            <th>Monat</th>
            <th class="text-right">Budget</th>
            <th class="text-right">Aktion</th>
          </tr>
        </thead>
        <tbody id="budgetTable">
          <tr class="empty-state">
            <td colspan="4">Lädt...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Budget bearbeiten</div>
      <div class="form-group">
        <label for="editBudgetAmount">Budget (€)</label>
        <input id="editBudgetAmount" type="number" step="0.01" min="0" placeholder="0,00" inputmode="decimal" autocomplete="off" />
      </div>
      <div class="modal-buttons">
        <button class="btn-primary" id="saveBtn" type="button">Speichern</button>
        <button class="btn-secondary" id="cancelBtn" type="button">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="budget.js"></script>
</body>
</html>
